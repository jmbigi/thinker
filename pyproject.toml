[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thinker-research"
version = "0.1.10"
description = "Sistema de investigación profunda con LLM: pensamiento estructurado, recuperación de fuentes y reportes trazables"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31",
    "openai>=1.0,<4",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
local = ["ollama>=0.3"]
# Herramientas de desarrollo verificadas en este repo (2026-10-14):
# ruff 0.6+, coverage 7+, mutmut 3+ (pruebas de mutación) y pytest (lo usa mutmut).
dev = ["ruff>=0.6", "coverage>=7.0", "mutmut>=3.0", "pytest>=8.0"]

[project.urls]
Repository = "https://github.com/jmbigi/thinker"

[project.scripts]
think = "pensamiento_layer:main"
research = "deep_research_system:main"
code-design = "code_design_improvement_tools:main"
evaluate-project = "evaluar_proyecto:main"

# Flat-layout con varios módulos de nivel raíz: el auto-descubrimiento de
# setuptools lo rechaza, así que se declaran explícitos (guía oficial de
# package discovery). `scripts` y los subpaquetes de plugins no llevan
# __init__.py: se instalan como namespace packages (PEP 420). `scripts` se
# instala porque el evaluador lo importa (`scripts.preflight`); `tests` NO se
# instala: un paquete raíz llamado `tests` en site-packages colisiona con
# cualquier otro proyecto que haga lo mismo — el benchmark se ejecuta desde
# el repo: `python3 -m tests.benchmarks.run_bench` (Hallazgo 83).
[tool.setuptools]
py-modules = [
    "code_design_improvement_tools",
    "deep_research_system",
    "evaluar_proyecto",
    "evidence",
    "llm_providers",
    "pensamiento_layer",
    "thinking_engine",
    "web_search",
]
packages = [
    "plugins",
    "plugins.llm_providers",
    "plugins.search_providers",
    "scripts",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# Pruebas de mutación (mutmut): miden si la suite detecta errores reales,
# no solo qué líneas se ejecutan. Uso: mutmut run
[tool.mutmut]
source_paths = [
    "code_design_improvement_tools.py",
    "deep_research_system.py",
    "llm_providers.py",
    "pensamiento_layer.py",
    "thinking_engine.py",
    "web_search.py",
]
# La campaña muta solo los 6 módulos de `source_paths`, que son los que se
# copian al sandbox `mutants/`. Los tests que importan módulos fuera de
# `source_paths` (plugins/, evaluar_proyecto.py, evidence.py y scripts/) se
# excluyen para que pytest pueda colectar allí. Siguen corriendo en `make test`.
pytest_add_cli_args_test_selection = [
    "tests",
    "--ignore=tests/test_plugin_registry.py",
    "--ignore=tests/test_plugin_providers.py",
    "--ignore=tests/test_plugin_cli.py",
    "--ignore=tests/test_plugin_dashboard.py",
    "--ignore=tests/test_evaluar_proyecto.py",
    "--ignore=tests/test_evaluador_corpus.py",
    "--ignore=tests/test_check_docs.py",
    "--ignore=tests/test_evidence.py",
    "--ignore=tests/test_preflight.py",
    "--ignore=tests/test_audit_changes.py",
    "--ignore=tests/test_run_holdout.py",
]
# Las líneas `print(...)` no alteran estado: mutarlas genera mutantes
# equivalentes que ninguna prueba puede matar. Se excluyen con la opción que el
# motor SÍ implementa (`do_not_mutate_patterns`; la lista `do_not_mutate` no la
# usa el motor y el pragma `# pragma: no mutate` solo afecta a su propia línea).
# La cifra con y sin esta exclusión se publica en AGENTS.md.
do_not_mutate_patterns = ["^\\s*print\\("]
