# Plugin Configuration for Deep Research System
# 
# All plugins are defined here with their runtime configuration.
# Priority: higher = preferred when multiple plugins of same type are loaded.

plugins:
  # LLM Providers
  openrouter:
    enabled: true
    priority: 100
    params:
      model: "poolside/laguna-xs-2.1:free"
      use_fallback: true
      max_retries: 3

  # Kilo AI Gateway: `cohere/north-mini-code:free` no requiere key (200 req/h por IP).
  # Con KILO_API_KEY se puede elegir cualquier modelo del catálogo.
  kilo:
    enabled: true
    priority: 95
    params:
      model: "cohere/north-mini-code:free"
      max_retries: 3
      timeout: 60.0
      use_cache: true

  deepseek:
    enabled: true
    priority: 90
    params:
      model: "deepseek-chat"
      max_retries: 3
      base_url: "https://api.deepseek.com/v1"

  # Opt-in estricto: reenvía prompts a DeepSeek y no debe quedar autorizado
  # en una configuración distribuida. Actívalo solo en tu config local tras
  # revisar docs/DEEPSEEK-FREE-AGENT.md; un fallo se eleva (sin fallback).
  deepseek_free_agent:
    enabled: false
    priority: 110
    params:
      base_url: "http://127.0.0.1:9527"
      timeout: 300
      authorized: false

  mock_llm:
    enabled: true
    priority: 10
    params: {}

  # Olla proxy (Apache 2.0, github.com/thushan/olla) - unifica Ollama, vLLM,
  # llama.cpp y LM Studio. Instalar: go install github.com/thushan/olla@latest
  # (o docker run -p 40114:40114 ghcr.io/thushan/olla:latest).
  # Rutas reales: /internal/health y /olla/proxy/v1/*; puerto 40114.
  olla:
    enabled: false  # opt-in: requiere Olla instalado y corriendo
    priority: 120
    params:
      base_url: "http://localhost:40114"
      model: ""  # vacío = primer modelo anunciado por Olla
      timeout: 120.0
      max_retries: 3
      use_cache: true
      health_check_interval: 30

  # Search Providers
  duckduckgo:
    enabled: true
    priority: 100
    params:
      max_results: 5
      timeout: 10

  wikipedia:
    enabled: true
    priority: 90
    params:
      language: "es"
      max_results: 5
      timeout: 10

  mock_search:
    enabled: true
    priority: 10
    params: {}

  # SOLLOL (MIT, pypi.org/project/sollol) es un orquestador EXTERNO de clusters
  # Ollama, no un plugin de thinker: no se declara aquí. Ver
  # docs/INFRAESTRUCTURA-COMPLETA.md para su uso opcional.

  # Core Plugins (for future extensions)
  # example_core_plugin:
  #   enabled: false
  #   priority: 50
  #   params: {}